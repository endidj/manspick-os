<?xml version="1.0" encoding="UTF-8"?>
<!-- 브라우저에서 Next.js 프런트엔드, 공통 서버, D1과 R2로 이어지는 요청 흐름입니다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="608" viewBox="0 0 840 608" role="img" aria-labelledby="title description">
  <title id="title">맨즈픽 OS 서비스 아키텍처</title>
  <desc id="description">브라우저는 Cloudflare Worker에서 실행되는 Next.js 프런트엔드의 랜딩 페이지, 고객 페이지 또는 어드민 페이지를 엽니다. 각 페이지의 API 요청은 서비스 바인딩을 통해 공통 Server Worker로 전달됩니다. 공통 서버는 예약과 사진 정보를 D1에서, 사진 파일을 비공개 R2에서 읽습니다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#526582" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="838" height="606" rx="24" fill="#f5f7fc" stroke="#dce3ef" stroke-width="2"/>
  <rect x="28" y="151" width="784" height="429" rx="19" fill="#ebf1fa" stroke="#bccbe1" stroke-dasharray="5 5"/>

  <rect x="318" y="87" width="204" height="45" rx="22.5" fill="#fff" stroke="#c9d5e6"/>
  <path d="M420 133v60" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="54" y="197" width="732" height="105" rx="15" fill="#fff" stroke="#afc2de"/>
  <g fill="#edf3fd" stroke="#d4e1f3">
    <rect x="74" y="245" width="220" height="38" rx="8"/>
    <rect x="310" y="245" width="220" height="38" rx="8"/>
    <rect x="546" y="245" width="220" height="38" rx="8"/>
  </g>

  <path d="M420 303v50" fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="151" y="358" width="538" height="74" rx="14" fill="#203451"/>

  <path d="M420 433v22m-193 0h386" fill="none" stroke="#526582" stroke-width="2"/>
  <g fill="none" stroke="#526582" stroke-width="2" marker-end="url(#arrow)">
    <path d="M227 455v20"/>
    <path d="M613 455v20"/>
  </g>
  <circle cx="420" cy="455" r="4" fill="#526582"/>

  <rect x="54" y="480" width="346" height="77" rx="13" fill="#fff" stroke="#afc2de"/>
  <rect x="440" y="480" width="346" height="77" rx="13" fill="#fff" stroke="#afc2de"/>
  <rect x="70" y="497" width="48" height="43" rx="9" fill="#e6edfe"/>
  <rect x="456" y="497" width="48" height="43" rx="9" fill="#fff0dc"/>

  <g font-family="Pretendard, Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#182a44">
    <text x="42" y="59" font-size="34" font-weight="750">맨즈픽 OS 아키텍처</text>
    <text x="420" y="116" text-anchor="middle" font-size="22" font-weight="700">브라우저</text>
    <text x="48" y="180" font-size="18" font-weight="750" fill="#7b420d">Cloudflare</text>

    <text x="74" y="229" font-size="23" font-weight="750">Next.js Frontend App 3개 (CF worker)</text>
    <text x="766" y="227" text-anchor="end" font-size="18" font-weight="600" fill="#415775">Vinext + Vite</text>
    <g text-anchor="middle" font-size="20" font-weight="700" fill="#253e61">
      <text x="184" y="271">랜딩 페이지</text>
      <text x="420" y="271">고객 페이지</text>
      <text x="656" y="271">어드민 페이지</text>
    </g>

    <text x="402" y="335" text-anchor="end" font-size="18" font-weight="700" fill="#415775">/api/…</text>
    <text x="438" y="335" font-size="18" font-weight="600" fill="#415775">MANSPICK_API · 서비스 바인딩</text>

    <text x="420" y="386" text-anchor="middle" font-size="25" font-weight="750" fill="#fff">공통 Server Worker</text>
    <text x="420" y="416" text-anchor="middle" font-size="17" fill="#e0eaf9">예약 처리 · 로그인과 접근 권한 확인</text>

    <text x="94" y="525" text-anchor="middle" font-size="21" font-weight="750" fill="#294481">D1</text>
    <text x="480" y="525" text-anchor="middle" font-size="21" font-weight="750" fill="#8b4811">R2</text>
    <text x="132" y="510" font-size="21" font-weight="750">SQL 데이터베이스</text>
    <text x="518" y="510" font-size="21" font-weight="750">비공개 파일 저장소</text>
    <text x="132" y="539" font-size="16" fill="#415775">예약 · 촬영 · 세션 · 사진 정보</text>
    <text x="518" y="539" font-size="16" fill="#415775">후보 사진 · 보정본 · 업로드 원본</text>
  </g>
</svg>
